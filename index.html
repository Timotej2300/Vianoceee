<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b19">
<title>Vianoce za… 🎄</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');
:root{--gold:#f5d58b;--cream:#fff8e9;--muted:#c7d6cc;--glass:rgba(255,255,255,.075)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;color:var(--cream);font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 50% 20%,#17433a 0%,#0b2925 42%,#041513 100%);display:grid;place-items:center}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 80%,rgba(199,45,55,.13),transparent 25%),radial-gradient(circle at 88% 15%,rgba(245,213,139,.10),transparent 22%)}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wrap{position:relative;z-index:2;width:min(1000px,94vw);padding:38px 20px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border:1px solid rgba(245,213,139,.25);border-radius:99px;background:rgba(255,255,255,.055);color:var(--gold);font-size:11px;letter-spacing:3px;text-transform:uppercase}
h1{font-family:'Playfair Display',serif;font-size:clamp(43px,8vw,82px);line-height:1.05;margin:24px 0 10px;font-weight:700;letter-spacing:-2px;text-shadow:0 8px 35px #0005}
h1 span{color:var(--gold)}
.subtitle{color:var(--muted);font-size:clamp(13px,2vw,16px);letter-spacing:.5px;margin:0 0 38px}
.timer{display:flex;justify-content:center;gap:clamp(8px,2vw,20px);perspective:1000px;flex-wrap:wrap}
.unit{width:clamp(105px,17vw,170px);height:clamp(120px,18vw,155px);border:1px solid rgba(255,255,255,.13);border-radius:23px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));box-shadow:0 20px 55px #0003,inset 0 1px 0 #ffffff20;backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;animation:float 5s ease-in-out infinite;transition:transform .35s}
.unit:nth-child(2){animation-delay:.25s}.unit:nth-child(3){animation-delay:.5s}.unit:nth-child(4){animation-delay:.75s}
.unit:before{content:"";position:absolute;inset:-60% -30%;background:linear-gradient(110deg,transparent 42%,#ffffff12 50%,transparent 58%);transform:translateX(-70%);animation:shine 7s ease-in-out infinite}
.number{font-size:clamp(42px,7vw,66px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:#fff9e9;text-shadow:0 4px 20px #f5d58b35;display:block}
.label{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-top:14px}
.unit.tick .number{animation:tick .45s cubic-bezier(.2,.8,.2,1)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-13px) rotate(1.5deg)}}
@keyframes shine{0%,65%,100%{transform:translateX(-70%)}82%{transform:translateX(70%)}}
@keyframes tick{0%{transform:translateY(-12px) rotateX(35deg) scale(.88);filter:blur(3px);opacity:.3}55%{transform:translateY(4px) rotateX(-8deg) scale(1.06);filter:blur(0);opacity:1}100%{transform:translateY(0) rotateX(0) scale(1)}}
.scene{height:190px;position:relative;margin:20px auto 0;max-width:620px}
.tree{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:145px;height:170px;filter:drop-shadow(0 15px 18px #0005);animation:treeSway 6s ease-in-out infinite}
@keyframes treeSway{0%,100%{transform:translateX(-50%) rotate(-1deg)}50%{transform:translateX(-50%) rotate(1deg)}}
.star{position:absolute;left:50%;top:0;transform:translateX(-50%);color:var(--gold);font-size:27px;text-shadow:0 0 20px #f5d58b;animation:starGlow 2s ease-in-out infinite alternate}
@keyframes starGlow{to{filter:brightness(1.5);text-shadow:0 0 30px #f5d58b}}
.gift{position:absolute;bottom:7px;width:58px;height:47px;border-radius:5px;background:#b8323e;box-shadow:0 10px 20px #0004}
.gift:before{content:"";position:absolute;left:24px;top:0;width:10px;height:100%;background:#e9c77f}
.gift:after{content:"";position:absolute;left:16px;top:-9px;width:26px;height:13px;border:4px solid #e9c77f;border-radius:50% 50% 0 50%;transform:rotate(15deg)}
.g1{left:calc(50% - 105px);transform:rotate(-8deg)}.g2{left:calc(50% + 48px);background:#d5a34e;transform:rotate(7deg)}.g2:before{background:#fff0ce}.g2:after{border-color:#fff0ce}
.moon{position:absolute;right:12%;top:18px;width:54px;height:54px;border-radius:50%;box-shadow:12px -7px 0 0 var(--gold);opacity:.8;transform:rotate(-20deg)}
.spark{position:absolute;color:#f5d58b;opacity:.7;animation:twinkle 2.5s ease-in-out infinite alternate}
.s1{left:17%;top:40px;font-size:18px}.s2{right:20%;top:90px;font-size:13px;animation-delay:.8s}.s3{left:27%;top:115px;font-size:12px;animation-delay:1.3s}
@keyframes twinkle{to{opacity:.2;transform:scale(.65) rotate(30deg)}}
.footer{color:#91aaa0;font-size:12px;letter-spacing:.7px;margin-top:4px}
.fullscreen{position:fixed;z-index:5;right:22px;top:22px;border:1px solid #ffffff2b;background:#ffffff12;color:#fff;border-radius:50px;padding:11px 16px;font:600 12px 'DM Sans',sans-serif;cursor:pointer;backdrop-filter:blur(10px);transition:.2s}
.fullscreen:hover{background:#ffffff25;transform:translateY(-2px)}
@media(max-width:520px){.wrap{padding:65px 10px 25px}h1{letter-spacing:-1px;margin-top:20px}.subtitle{margin-bottom:28px}.unit{width:calc(50% - 8px);height:112px;border-radius:18px}.number{font-size:45px}.scene{height:160px}.tree{transform:translateX(-50%) scale(.85);transform-origin:bottom center}.moon{right:9%;top:0}.fullscreen{top:12px;right:12px}}

.collab{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  margin:0 auto 22px;position:relative;
}
.collab-label{
  color:#cbd5e1;font-size:10px;font-weight:600;letter-spacing:3px;
  text-transform:uppercase;
}
.collab-names{
  display:flex;align-items:center;justify-content:center;gap:13px;
  flex-wrap:wrap;font-size:clamp(14px,2vw,18px);font-weight:700;
  letter-spacing:.35px;
}
.shimmer{
  display:inline-block;position:relative;color:transparent;
  background-size:220% 100%;background-clip:text;-webkit-background-clip:text;
  animation:brandShimmer 3.4s ease-in-out infinite;
  filter:drop-shadow(0 0 10px currentColor);
}
.xylon{
  background-image:linear-gradient(105deg,#9b7bff 0%,#c4b5fd 25%,#fff 43%,#a78bfa 55%,#7c3aed 75%,#c4b5fd 100%);
  -webkit-text-fill-color:transparent;
}
.duper{
  background-image:linear-gradient(105deg,#f8fafc 0%,#fff 30%,#cbd5e1 45%,#fff 55%,#e2e8f0 100%);
  -webkit-text-fill-color:transparent;
}
.films{
  background-image:linear-gradient(105deg,#ef4444 0%,#ff9a9a 28%,#fff 45%,#f87171 58%,#dc2626 78%,#fecaca 100%);
  -webkit-text-fill-color:transparent;
}
.brand-divider{
  display:inline-block;width:1px;height:22px;margin:0 3px;
  background:linear-gradient(180deg,transparent,#aeb8c2 18%,#f8fafc 50%,#8b96a3 82%,transparent);
  box-shadow:0 0 8px rgba(226,232,240,.3);
  position:relative;overflow:hidden;
}
.brand-divider:after{
  content:"";position:absolute;inset:-50% -2px;
  background:linear-gradient(180deg,transparent 35%,#fff 50%,transparent 65%);
  animation:dividerShine 3.2s ease-in-out infinite;
}
@keyframes dividerShine{
  0%,100%{transform:translateY(-65%)}
  55%{transform:translateY(65%)}
}
.domain{
  color:#a9c2b7;font-size:10px;letter-spacing:1.5px;
  opacity:.85;margin-top:1px;
}
@keyframes brandShimmer{
  0%,100%{background-position:100% 50%;transform:translateY(0)}
  50%{background-position:0% 50%;transform:translateY(-1px)}
}
@media(prefers-reduced-motion:reduce){.shimmer{animation:none}}

</style>
</head>
<body>
<canvas id="snow"></canvas>
<button class="fullscreen" id="fullscreenBtn" type="button">⛶ Celá obrazovka</button>
<main class="wrap">
  <div class="collab" aria-label="Na webe spolupracovali X4yl0n a DuperFilms">
    <div class="collab-label">Spolupracovali na tomto webe</div>
    <div class="collab-names">
      <span class="shimmer xylon">X4yl0n</span>
      <span class="brand-divider" aria-hidden="true"></span>
      <span><span class="shimmer duper">Duper</span><span class="shimmer films">Films</span></span>
    </div>
    <div class="domain">vianoce.duperfilms.eu</div>
  </div>
  <div class="eyebrow">✦ Najkrajší čas roka ✦</div>
  <h1>Vianoce <span>za:</span></h1>
  <p class="subtitle">Odpočítavame chvíle do 24. decembra 2026</p>
  <section class="timer" aria-label="Odpočet do Vianoc">
    <div class="unit"><span class="number" id="days">00</span><span class="label">Dní</span></div>
    <div class="unit"><span class="number" id="hours">00</span><span class="label">Hodín</span></div>
    <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minút</span></div>
    <div class="unit"><span class="number" id="seconds">00</span><span class="label">Sekúnd</span></div>
  </section>
  <div class="scene" aria-hidden="true">
    <div class="moon"></div><span class="spark s1">✧</span><span class="spark s2">✦</span><span class="spark s3">✧</span>
    <div class="tree">
      <div class="star">★</div>
      <svg viewBox="0 0 150 165" width="145" height="165" xmlns="http://www.w3.org/2000/svg">
        <path d="M75 12 L42 58 H58 L25 101 H51 L12 145 H138 L99 101 H125 L92 58 H108 Z" fill="#176044"/>
        <path d="M75 12 L42 58 H58 L25 101 H51 L12 145 H75 Z" fill="#207653" opacity=".7"/>
        <rect x="65" y="139" width="20" height="25" rx="3" fill="#8b5637"/>
        <path d="M51 58 Q75 74 99 58 M34 101 Q75 120 116 101" fill="none" stroke="#d5b36a" stroke-width="2" opacity=".8"/>
        <circle cx="60" cy="75" r="5" fill="#e7bd64"/><circle cx="91" cy="91" r="5" fill="#c83c48"/><circle cx="69" cy="119" r="5" fill="#e7bd64"/><circle cx="103" cy="130" r="4" fill="#c83c48"/>
      </svg>
    </div>
    <div class="gift g1"></div><div class="gift g2"></div>
  </div>
  <div class="footer">Nech sú tieto Vianoce plné radosti, pokoja a zázrakov. ❄</div>
</main>
<script>
const target = new Date('2026-12-24T17:30:00');
const ids = ['days','hours','minutes','seconds'];
let previous = {};
function updateCountdown(){
  let diff = Math.max(0, target.getTime() - Date.now());
  const values = [
    Math.floor(diff / 86400000),
    Math.floor(diff / 3600000) % 24,
    Math.floor(diff / 60000) % 60,
    Math.floor(diff / 1000) % 60
  ];
  ids.forEach((id,i)=>{
    const el=document.getElementById(id), value=String(values[i]).padStart(2,'0');
    if(previous[id] !== value){
      el.textContent=value;
      const card=el.closest('.unit');
      card.classList.remove('tick'); void card.offsetWidth; card.classList.add('tick');
      previous[id]=value;
    }
  });
  if(diff===0) document.querySelector('.subtitle').textContent='Šťastné a veselé Vianoce! 🎄';
}
updateCountdown(); setInterval(updateCountdown,1000);

const btn=document.getElementById('fullscreenBtn');
btn.addEventListener('click',async()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){btn.textContent='Fullscreen nie je podporovaný';}
});
document.addEventListener('fullscreenchange',()=>{
  btn.textContent=document.fullscreenElement?'✕ Ukončiť fullscreen':'⛶ Celá obrazovka';
});

// Jemné padajúce vločky na canvas – bez ďalších knižníc.
const canvas=document.getElementById('snow'),ctx=canvas.getContext('2d');
let flakes=[];
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  flakes=Array.from({length:Math.min(130,Math.floor(innerWidth/9))},()=>({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*2.2+.5,s:Math.random()*1.1+.35,
    drift:Math.random()*.7-.35,alpha:Math.random()*.55+.2
  }));
}
function drawSnow(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(const f of flakes){
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${f.alpha})`;ctx.fill();
    f.y+=f.s;f.x+=f.drift+Math.sin(f.y*.012)*.25;
    if(f.y>innerHeight+5){f.y=-5;f.x=Math.random()*innerWidth;}
    if(f.x>innerWidth+5)f.x=-5;if(f.x< -5)f.x=innerWidth+5;
  }
  requestAnimationFrame(drawSnow);
}
addEventListener('resize',resize);resize();drawSnow();
</script>
</body>
</html>
